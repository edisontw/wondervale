<!-- Continuous public same-bank route from promenade junction x1100 y755 to gazebo x1380 y655. -->
<path id="walkable-side-path" d="M1082 748Q1140 691 1243 657T1430 646L1497 712Q1352 720 1245 750T1143 806Z" fill="url(#path)" stroke="#b89c77" stroke-width="6"/>
<path d="M1082 748Q1140 691 1243 657T1430 646L1497 712Q1352 720 1245 750T1143 806Z" fill="url(#pavers)" opacity=".46"/>
<!-- Guard railing protects bank side, including near overlook; all player regions are on SOUTH side. -->
<g id="public-bank-rail" stroke="#765c41" stroke-linejoin="round" stroke-linecap="round">
 <path d="M42 639Q278 622 463 643L627 639M867 639Q1080 628 1237 628" fill="none" stroke-width="9"/>
 <path d="M42 657Q278 640 463 661L627 657M867 657Q1080 646 1237 646" fill="none" stroke-width="6"/>
 <path d="M42 636V674M160 628V670M291 630V668M424 635V675M560 639V674M895 637V669M1018 632V667M1139 631V663" stroke-width="14"/>
</g>
<!-- Lookout is grounded on near bank ABOVE its open side-path but BELOW river shoreline; protected all around. -->
<g id="protected-public-lookout">
