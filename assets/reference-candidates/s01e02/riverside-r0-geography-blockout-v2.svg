<path id="walkable-promenade" d="M0 719Q250 690 437 709T850 704T1180 691L1600 730V900H0Z" fill="url(#path)" stroke="#b69a70" stroke-width="7"/>
<path d="M0 719Q250 690 437 709T850 704T1180 691L1600 730V900H0Z" fill="url(#pavers)" opacity=".55"/>
