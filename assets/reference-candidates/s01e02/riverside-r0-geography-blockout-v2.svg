<g id="closed-old-bridge-barrier">
 <path d="M646 647H844" stroke="#705443" stroke-width="15" stroke-linecap="round"/>
 <path d="M646 616V670M844 616V670" stroke="#705443" stroke-width="17" stroke-linecap="round"/>
 <path d="M660 622L833 667M664 665L830 621" stroke="#926d51" stroke-width="12" stroke-linecap="round"/>
 <rect x="723" y="626" width="43" height="30" rx="5" fill="#d9bc91" stroke="#5f5547" stroke-width="5"/>
