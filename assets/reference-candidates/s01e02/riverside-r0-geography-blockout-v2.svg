 <path d="M682 538 L809 538 L804 559 L689 559 Z" fill="#c7b494"/>
 <path d="M711 558V639 M748 558V641 M784 558V640 M697 590H797 M693 618H801" fill="none" stroke="#867866" stroke-width="3"/>
 <path d="M700 543L793 543" stroke="#e3d2ae" stroke-width="5"/>
