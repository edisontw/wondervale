<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Unlabelled Riverside near-bank scenic geography blockout, safe promenade and protected overlook, old bridge permanently closed with its deck missing">
<defs>
