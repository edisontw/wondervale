<path id="stone-retaining-edge" d="M0 613Q269 601 442 615T814 613T1167 606T1600 616" fill="none" stroke="#b1a48d" stroke-width="18"/>
<path d="M0 625Q269 610 442 625T814 621T1167 615T1600 628" fill="none" stroke="#5f7669" stroke-width="7"/>
