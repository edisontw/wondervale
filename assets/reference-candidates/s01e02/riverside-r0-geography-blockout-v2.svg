 <path d="M1265 604Q1375 573 1494 608" fill="none" stroke="#71533e" stroke-width="15" stroke-linecap="round"/>
 <path d="M1315 600L1315 561M1440 600V561" stroke="#78583c" stroke-width="16"/>
 <path d="M1260 566L1377 518L1500 568Z" fill="url(#roof)" stroke="#634633" stroke-width="9" stroke-linejoin="round"/>
 <path d="M1320 552L1377 530L1440 554" stroke="#d9a565" stroke-width="5" fill="none"/>
</g>
