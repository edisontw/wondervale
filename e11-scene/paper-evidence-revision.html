<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milo's clue model — PAPER</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5eedf;color:#24364a;font:18px system-ui}main{max-width:780px;margin:auto;padding:12px}button{font:inherit;min-height:44px;margin:4px;padding:8px;border:2px solid #526578;border-radius:8px;background:white}button:focus-visible{outline:3px solid #b60}button[aria-pressed=true]{background:#d3eafa}#model{border:3px solid #526578;border-radius:12px;padding:20px;min-height:85px;background:#eee}#model.two-trace-model{background:linear-gradient(90deg,#d8e6fa 50%,#f8e2ac 50%)}#chronicle{padding:12px;background:#e9e0c8;overflow-wrap:anywhere}</style>
<main><h1>Milo's clue model — PAPER</h1><p>Look at two pretend clues. Try a model. Change your mind!</p>
<button id="inspect">Look at clues</button><p id="clues">Clues are covered.</p>
<div role="group" aria-label="Choose a clue"><button id="old-map" disabled>Old map</button><button id="new-mark" disabled>New mark</button><button id="both" disabled>Both clues</button></div>
<button id="try" disabled>Try model</button><button id="undo" disabled>Undo</button><button id="restart">Restart</button>
<section id="model" role="status">The model is blank.</section><p id="nia"></p><p id="finn"></p><p id="chronicle">No PAPER Chronicle yet.</p>
<small>Fictional evidence only. No E05 source provenance, real history, rights, safety, Common identity or Canon unlock. North Hill CLOSED.</small></main>
<script type="module">
import {replayEvidence} from './paper-evidence-revision.mjs';
let events=[];const $=id=>document.getElementById(id);
function render(){const s=replayEvidence(events);$('inspect').disabled=s.observed;$('clues').textContent=s.observed?'Pretend old map: a line. Pretend new mark: a dot. Which should our model show?':'Clues are covered.';
for(const id of ['old-map','new-mark','both']){$(id).disabled=!s.observed;$(id).setAttribute('aria-pressed',String(s.selected===id));}
$('try').disabled=!s.selected;$('undo').disabled=!events.length;
$('model').className=s.model;$('model').textContent=({unmarked:'The model is blank.','old-only-model':'Model: one old line.','new-only-model':'Model: one new dot.','two-trace-model':'Model: old line + new dot.'})[s.model];
$('nia').textContent=s.model==='unmarked'?'':s.nia;$('finn').textContent=s.model==='unmarked'?'':s.finn;
$('chronicle').textContent=s.chronicle.at(-1)||'No PAPER Chronicle yet.';}
function act(e){const candidate=[...events,e];if(replayEvidence(candidate)){events=candidate;render();}}
$('inspect').onclick=()=>act({type:'inspect'});
for(const id of ['old-map','new-mark','both'])$(id).onclick=()=>act({type:'choose',option:id});
$('try').onclick=()=>act({type:'try'});$('undo').onclick=()=>{events.pop();render();};$('restart').onclick=()=>{events=[];render();};render();
</script></html>
