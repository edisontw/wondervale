<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milo's Listening Lantern — PAPER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0df;color:#23364b;font:18px system-ui}
main{max-width:850px;margin:auto;padding:12px}button{font:inherit;min-height:48px;margin:4px;padding:8px 14px;border:2px solid #456;border-radius:9px;background:white}
button:focus-visible{outline:3px solid #c70}button[aria-pressed=true]{background:#cde9ee}
#world{min-height:105px;border:3px solid #64778a;border-radius:14px;padding:15px;background:#e3e8e9;transition:background .2s}
#world.quiet{background:#d7e5ed}#world.signal{background:#ffe5a7}
#nia,#finn,#chronicle{padding:8px;min-height:38px}#chronicle{background:#eae3d4}
</style>
<main><h1>Milo's Listening Lantern</h1>
<p>Imaginary PAPER experiment. Milo can try a quiet lantern or a bright signal. Listen to Nia and Finn, then change your plan.</p>
<div role="group" aria-label="Lantern choice"><button id="quiet">Quiet light</button><button id="signal">Bright signal</button></div>
<button id="try">Try</button><button id="undo">Undo</button><button id="restart">Restart</button>
<section id="world" aria-label="Visible lantern world" role="status"></section>
<p id="nia"></p><p id="finn"></p><p id="chronicle" aria-label="PAPER Chronicle"></p>
<p><small>Neither option is a final solution. No real place, permissions, lighting safety, or Common identity is established.</small></p>
</main>
<script type="module">
import {replayLantern,lanternAction,lanternUndo} from './paper-listening-lantern.mjs';
let events=[];const $=id=>document.getElementById(id);
function render(){const s=replayLantern(events);$('quiet').setAttribute('aria-pressed',String(s.mode==='quiet'));$('signal').setAttribute('aria-pressed',String(s.mode==='signal'));$('world').className=s.tested?s.mode:'';$('world').textContent=s.world;$('nia').textContent=s.nia;$('finn').textContent=s.finn;$('chronicle').textContent=s.chronicle;$('undo').disabled=!events.length}
function act(e){events=lanternAction(events,e);render()}
$('quiet').onclick=()=>act({type:'choose',mode:'quiet'});$('signal').onclick=()=>act({type:'choose',mode:'signal'});
$('try').onclick=()=>act({type:'try'});$('undo').onclick=()=>{events=lanternUndo(events);render()};
$('restart').onclick=()=>{events=[];render()};render();
</script></html>
