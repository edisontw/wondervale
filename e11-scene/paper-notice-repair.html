<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milo's PAPER Notice</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f1e3;color:#263443;font:18px system-ui}main{max-width:850px;margin:auto;padding:12px}button{font:inherit;min-height:44px;border:2px solid #456;border-radius:9px;background:white;padding:7px;margin:3px}button:focus-visible{outline:3px solid #b60}button[aria-pressed=true]{background:#cde9ee}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}.slot{min-height:70px;overflow-wrap:anywhere}#response,#chronicle{min-height:35px;padding:8px;background:#e8e5da}#notice{font-weight:bold}</style><main><h1>Milo's Paper Notice</h1><p>Pretend words, not a real Common clue. Choose a word, then a space. Read and fix!</p><div id="pieces" aria-label="Words"></div><div id="slots" class="slots" aria-label="Spaces"></div><button id="read">Read</button><button id="undo">Undo</button><button id="restart">Restart</button><p id="response" role="status" aria-live="polite"></p><p id="notice"></p><p id="chronicle"></p></main><script type="module">import {PIECES,replayNotice,dispatchNotice,undoNotice} from './paper-notice-repair.mjs';let events=[],selected='we';const $=id=>document.getElementById(id);function act(e){events=dispatchNotice(events,e);render()}function render(){const s=replayNotice(events);$('pieces').replaceChildren(...PIECES.map(p=>{const b=document.createElement('button');b.textContent=p.toUpperCase();b.dataset.piece=p;b.setAttribute('aria-pressed',String(selected===p));b.onclick=()=>{selected=p;render()};return b}));$('slots').replaceChildren(...s.slots.map((p,i)=>{const b=document.createElement('button');b.className='slot';b.dataset.slot=i;b.setAttribute('aria-label','Space '+(i+1));b.textContent=p?p.toUpperCase():'Space '+(i+1);b.onclick=()=>act({type:'place',piece:selected,slot:i});return b}));$('read').disabled=s.slots.some(x=>x===null);$('undo').disabled=!events.length;$('response').textContent=s.response;$('notice').textContent=s.visibleNotice||'';$('chronicle').textContent=s.chronicle||''}$('read').onclick=()=>act({type:'read'});$('undo').onclick=()=>{events=undoNotice(events);render()};$('restart').onclick=()=>{events=[];selected='we';render()};render()</script></html>
