name: Wondervale E03 M0 engineering slice
on:
  pull_request:
    paths: ['e03/**', 'engine/s01e03.mjs', 'public/s01e03.json', 'tests/s01e03*', 'tests/e03-cart-*', 'tests/e03-sn-*', 'scripts/compile_e03.py', 'scripts/package_e03.py', 'scripts/audit_e03_cart_sweep.mjs', 'content/season-01/s01e03/**', '.github/workflows/wondervale-e03-preview.yml']
  push:
    branches: [main]
    paths: ['e03/**', 'engine/s01e03.mjs', 'public/s01e03.json', 'tests/s01e03*', 'tests/e03-cart-*', 'tests/e03-sn-*', 'scripts/compile_e03.py', 'scripts/package_e03.py', 'scripts/audit_e03_cart_sweep.mjs', '.github/workflows/wondervale-e03-preview.yml']
permissions:
  contents: read
jobs:
  e03:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact media and candidate script IDs
        run: |
          python3 scripts/verify_episode_media.py
          python3 scripts/compile_e03.py
          git diff --exit-code -- public/s01e03.json
      - name: Test E03 routes, progression, prerequisites, restore and replay
        run: node --test tests/s01e03.test.mjs tests/e03-cart-turn.test.mjs tests/e03-sn-geometry.test.mjs
      - name: Audit swept cart display envelope against painted unloading
        run: node scripts/audit_e03_cart_sweep.mjs
      - name: Package isolated E03 preview
        run: python3 scripts/package_e03.py
      - run: npm install --ignore-scripts --package-lock=false
      - run: npx playwright install --with-deps chromium
      - name: Test actual E03 packaged desktop and touch scene
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/wondervale-e03-preview > /tmp/e03-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --show-error --fail http://127.0.0.1:4173/e03/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::E03 preview HTTP server was not ready before Chromium"
            cat /tmp/e03-server.log
            exit 1
          fi
          node tests/s01e03-browser.mjs
          node tests/e03-cart-waypoint-browser.mjs
      - name: Review isolated M1 candidate; preserve unresolved clearance evidence
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory . > /tmp/e03-art-review-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --show-error --fail http://127.0.0.1:4174/e03/route-review.html >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::E03 art-review HTTP server was not ready before Chromium"
            cat /tmp/e03-art-review-server.log
            exit 1
          fi
          TEST_ART_BASE_URL=http://127.0.0.1:4174 node tests/s01e03-art-review.mjs
          TEST_ART_BASE_URL=http://127.0.0.1:4174 node tests/s01e03-depth.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e03-engineering-evidence
          path: test-results/e03-*
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wondervale-e03-preview
          path: dist/wondervale-e03-preview/
