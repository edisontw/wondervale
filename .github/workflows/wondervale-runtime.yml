name: Wondervale E01 runtime acceptance
on:
  push:
    branches: [main, feat/s01e01-playable-slice]
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original production and runtime image integrity
        run: python3 scripts/verify_production_assets.py
      - name: Exercise MN4 remote archive guards (synthetic, no deployment)
        run: python3 -m unittest discover -s tests -p 'test_mn4_release_archive.py' -v
      - name: Compile exact locked episode text
        run: npm run build
      - name: Verify core behavior and saves
        run: npm test
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts --package-lock=false
      - name: Install actual Chromium
        run: npx playwright install --with-deps chromium
      - name: Package runtime-only static release
        run: python3 scripts/package_static.py
      - name: Run actual desktop, touch, keyboard, save and replay paths
        run: |
          python3 -m http.server 4173 --directory dist/wondervale-e01-static > /tmp/wondervale-test-server.log 2>&1 &
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e01-runtime-evidence
          path: test-results/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wondervale-e01-static
          path: dist/wondervale-e01-static/
