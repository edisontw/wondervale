name: Wondervale E08 isolated light and viewpoint model
on:
  pull_request:
    paths:
      - 'engine/s01e08-authoring-prototype.mjs'
      - 'tests/s01e08-authoring-prototype.test.mjs'
      - '.github/workflows/wondervale-e08-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'engine/s01e08-authoring-prototype.mjs'
      - 'tests/s01e08-authoring-prototype.test.mjs'
      - '.github/workflows/wondervale-e08-prototype.yml'
permissions:
  contents: read
jobs:
  e08-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check E08 pure model and Node tests
        run: |
          node --check engine/s01e08-authoring-prototype.mjs
          node --check tests/s01e08-authoring-prototype.test.mjs
      - name: Test computed perspective, safe lamp model and replay
        run: node --test tests/s01e08-authoring-prototype.test.mjs
      - name: Ensure authoring-only E08 is absent from production packaging
        run: |
          if grep -R -n -E 's01e08-authoring-prototype|e08-prototype' scripts/package_static.py scripts/compile_episode.py scripts/package_e03.py; then
            echo 'E08 synthetic model unexpectedly referenced by production packaging' >&2
            exit 1
          fi
