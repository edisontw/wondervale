name: Wondervale E09-E10 independent PAPER scene transfer
on:
  pull_request:
    paths:
      - 'authoring-labs/e09-e10-scene-transfer.mjs'
      - 'authoring-labs/e04-e10-scene-transfer.mjs'
      - 'tests/season1-e04-e07-scene-transfer.test.mjs'
      - 'tests/season1-e04-e10-scene-transfer-browser.mjs'
      - 'tests/fixtures/season1-e04-e09-paper.mjs'
      - 'e09-scene/**'
      - 'e10-scene/**'
      - 'tests/season1-e09-e10-scene-transfer*'
      - 'tests/season1-e08-e10-clue-transfer.test.mjs'
      - '.github/workflows/wondervale-e09-e10-scene-transfer.yml'
  push:
    branches: [main]
    paths:
      - 'authoring-labs/e09-e10-scene-transfer.mjs'
      - 'authoring-labs/e04-e10-scene-transfer.mjs'
      - 'tests/season1-e04-e07-scene-transfer.test.mjs'
      - 'tests/season1-e04-e10-scene-transfer-browser.mjs'
      - 'tests/fixtures/season1-e04-e09-paper.mjs'
      - 'e09-scene/**'
      - 'e10-scene/**'
      - 'tests/season1-e09-e10-scene-transfer*'
      - 'tests/season1-e08-e10-clue-transfer.test.mjs'
      - '.github/workflows/wondervale-e09-e10-scene-transfer.yml'
permissions:
  contents: read
jobs:
  independent-paper-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node strict replay and upstream regressions
        run: |
          node --check authoring-labs/e09-e10-scene-transfer.mjs
          node --check authoring-labs/e04-e10-scene-transfer.mjs
          node --check tests/season1-e04-e10-scene-transfer-browser.mjs
          node --check e09-scene/main.mjs
          node --check e10-scene/hill-world.mjs
          node --check e10-scene/clue-transfer.mjs
          node --check tests/season1-e08-e10-clue-transfer.test.mjs
          node --check tests/season1-e09-e10-world-callback.test.mjs
          node --check tests/season1-e09-e10-scene-transfer-browser.mjs
          node --test tests/season1-e09-e10-scene-transfer.test.mjs tests/season1-e09-e10-world-callback.test.mjs tests/season1-e08-e10-clue-transfer.test.mjs tests/season1-e04-e07-scene-transfer.test.mjs tests/season1-e08-e09-scene-transfer.test.mjs tests/season1-unnamed-story.test.mjs tests/season1-e09-scene-shell.test.mjs
      - name: PAPER code stays out of production packages
        run: |
          if grep -R -n 'e09-e10-scene-transfer' scripts/package_static.py scripts/compile_episode.py scripts/package_e03.py; then
            echo 'Independent PAPER transfer cannot enter production package' >&2
            exit 1
          fi
      - name: Install Chromium
        run: |
          npm install --ignore-scripts --package-lock=false
          npx playwright install --with-deps chromium
      - name: Browser earned handoff, mobile, CLOSED hill and return
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/e09-e10-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4173/e09-scene/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/e09-e10-server.log >&2; exit 1; fi
          node tests/season1-e09-e10-scene-transfer-browser.mjs
          node tests/season1-e04-e10-scene-transfer-browser.mjs
          node tests/season1-e09-scene-shell-browser.mjs
          node tests/season1-e10-scene-shell-browser.mjs
