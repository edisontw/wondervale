name: Wondervale E05-E06 independent PAPER scene transfer
on:
  pull_request:
    paths:
      - 'authoring-labs/e05-e06-scene-transfer.mjs'
      - 'e05-scene/**'
      - 'e06-scene/**'
      - 'tests/season1-e05-e06-scene-transfer*'
      - '.github/workflows/wondervale-e05-e06-scene-transfer.yml'
  push:
    branches: [main]
    paths:
      - 'authoring-labs/e05-e06-scene-transfer.mjs'
      - 'e05-scene/**'
      - 'e06-scene/**'
      - 'tests/season1-e05-e06-scene-transfer*'
permissions:
  contents: read
jobs:
  paper-station-garden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node strict replay and source boundary
        run: |
          set -euo pipefail
          node --check authoring-labs/e05-e06-scene-transfer.mjs
          node --check e05-scene/main.mjs
          node --check e06-scene/main.mjs
          node --check tests/season1-e05-e06-scene-transfer-browser.mjs
          node --test tests/season1-e05-e06-scene-transfer.test.mjs tests/season1-e05-scene-shell.test.mjs tests/season1-e06-scene-shell.test.mjs tests/season1-e06-e07-scene-transfer.test.mjs
      - name: Keep PAPER outside production packages
        run: |
          if grep -n -E 'e05-e06-scene-transfer|e05-scene|e06-scene' scripts/package_static.py scripts/package_e02.py scripts/package_e03.py scripts/compile_episode.py; then
            echo 'ERROR: noncanonical E05-E06 included in release packaging' >&2
            exit 1
          fi
      - name: Install Playwright Chromium
        run: |
          npm install --ignore-scripts --package-lock=false
          npx playwright install --with-deps chromium
      - name: Three-viewport child-earned station and garden return
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . >/tmp/e05-e06-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/e05-scene/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/e05-e06-server.log >&2; exit 1; fi
          node tests/season1-e05-e06-scene-transfer-browser.mjs
          node tests/season1-e05-scene-shell-browser.mjs
          node tests/season1-e06-scene-shell-browser.mjs
