name: Wondervale reference intake integrity
on:
  push:
    branches: [main, art/s01e01-work-reference-intake]
    paths: ['assets/reference-candidates/s01e01/**', 'scripts/verify_reference_intake.py', '.github/workflows/wondervale-reference-intake.yml']
  pull_request:
    paths: ['assets/reference-candidates/s01e01/**', 'scripts/verify_reference_intake.py', '.github/workflows/wondervale-reference-intake.yml']
permissions:
  contents: read
jobs:
  verify-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact original bytes, PNG dimensions and every chunk CRC
        run: python scripts/verify_reference_intake.py --manifest assets/reference-candidates/s01e01/WORK_INTAKE_MANIFEST.json
